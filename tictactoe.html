
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #1f0e3a;
      --panel: rgba(34, 13, 67, 0.88);
      --panel-alt: rgba(49, 18, 98, 0.92);
      --text: #ece7ff;
      --muted: #c4b5fd;
      --accent: #a78bfa;
      --accent-soft: rgba(167, 139, 250, 0.18);
      --border: rgba(195, 160, 255, 0.2);
      font-family: Inter, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(167,139,250,0.16), transparent 30%),
                  linear-gradient(180deg, #12052f 0%, #1f0e3a 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    main {
      max-width: 500px;
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 28px 80px rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(16px);
      text-align: center;
    }

    header {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 0.3rem;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    #status {
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      color: var(--accent);
      font-weight: 600;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .cell {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-radius: 16px;
      aspect-ratio: 1 / 1;
      font-size: 3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }

    .cell:hover {
      border-color: var(--accent);
      box-shadow: 0 10px 30px rgba(167, 139, 250, 0.35);
      transform: translateY(-2px);
    }

    button {
      background: var(--accent-soft);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.7rem 1.2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: var(--accent);
      color: #12052f;
      box-shadow: 0 8px 24px rgba(167, 139, 250, 0.4);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <main>
    <header>Tic Tac Toe</header>
    <p class="subtitle">Two‑player local game</p>

    <div id="status">Player X’s turn</div>

    <div class="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <button onclick="resetGame()">Reset Game</button>
  </main>

  <script>
    const cells = document.querySelectorAll('.cell');
    const statusText = document.getElementById('status');

    let currentPlayer = 'X';
    let gameActive = true;
    let board = ["", "", "", "", "", "", "", "", ""];

    const winConditions = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        const index = cell.dataset.index;

        if (board[index] || !gameActive) return;

        board[index] = currentPlayer;
        cell.textContent = currentPlayer;

        checkResult();
      });
    });

    function checkResult() {
      let winner = null;

      for (const [a,b,c] of winConditions) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          winner = currentPlayer;
        }
      }

      if (winner) {
        statusText.textContent = `Player ${winner} wins!`;
        gameActive = false;
        return;
      }

      if (!board.includes("")) {
        statusText.textContent = "It's a draw!";
        gameActive = false;
        return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      statusText.textContent = `Player ${currentPlayer}’s turn`;
    }

    function resetGame() {
      board = ["", "", "", "", "", "", "", "", ""];
      cells.forEach(cell => cell.textContent = "");
      currentPlayer = 'X';
      gameActive = true;
      statusText.textContent = "Player X’s turn";
    }
  </script>
</body>
</html>
