<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Page - Wayne Orr Portfolio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1f0e3a;
      --panel: rgba(34, 13, 67, 0.88);
      --panel-alt: rgba(49, 18, 98, 0.92);
      --text: #ece7ff;
      --muted: #c4b5fd;
      --accent: #a78bfa;
      --accent-soft: rgba(167, 139, 250, 0.18);
      --border: rgba(195, 160, 255, 0.2);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(167, 139, 250, 0.16), transparent 30%),
                  linear-gradient(180deg, #12052f 0%, #1f0e3a 100%);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      max-width: 900px;
      padding: 2rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 28px 80px rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(16px);
    }

    header {
      font-size: clamp(2rem, 3vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 0.5rem;
    }

    .password-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 2rem;
      padding: 2rem;
      border: 2px solid var(--accent);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(167, 139, 250, 0.1), rgba(167, 139, 250, 0.05));
      box-shadow: 0 0 30px rgba(167, 139, 250, 0.2), inset 0 0 30px rgba(167, 139, 250, 0.1);
      animation: glow 3s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% {
        box-shadow: 0 0 30px rgba(167, 139, 250, 0.2), inset 0 0 30px rgba(167, 139, 250, 0.1);
      }
      50% {
        box-shadow: 0 0 50px rgba(167, 139, 250, 0.4), inset 0 0 40px rgba(167, 139, 250, 0.2);
      }
    }

    .password-form > p {
      font-size: 1.1rem;
      color: var(--accent);
      font-weight: 600;
      margin: 0;
    }

    label {
      font-weight: 700;
      color: var(--accent);
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="password"] {
      padding: 1rem 1.2rem;
      border: 2px solid var(--accent);
      border-radius: 12px;
      background: rgba(49, 18, 98, 0.8);
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(167, 139, 250, 0.2);
    }

    input[type="password"]:focus {
      outline: none;
      border-color: var(--text);
      box-shadow: 0 0 30px rgba(167, 139, 250, 0.5), inset 0 0 20px rgba(167, 139, 250, 0.1);
      background: rgba(49, 18, 98, 1);
      transform: scale(1.02);
    }

    button {
      padding: 1rem 2rem;
      border: 2px solid var(--accent);
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-soft), rgba(167, 139, 250, 0.2));
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 20px rgba(167, 139, 250, 0.3);
    }

    button:hover {
      background: linear-gradient(135deg, rgba(167, 139, 250, 0.3), rgba(167, 139, 250, 0.15));
      box-shadow: 0 8px 40px rgba(167, 139, 250, 0.5);
      transform: translateY(-3px) scale(1.02);
      border-color: var(--text);
    }

    .error {
      color: #ff6b6b;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }

    .content {
      display: none;
    }

    .content.visible {
      display: block;
    }

    .password-form.hidden {
      display: none;
    }

    h2 {
      margin-top: 1.5rem;
      margin-bottom: 1rem;
      font-size: clamp(1.5rem, 2vw, 2rem);
    }

    p {
      color: #9aad9e;
      margin-bottom: 1rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: all 0.3s ease;
    }

    a:hover {
      color: var(--text);
      text-decoration: underline;
    }

    .back-link {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .back-link a {
      display: inline-block;
      padding: 1rem 1.5rem;
      border: 2px solid var(--accent);
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .back-link a::before {
      content: '';
      position: absolute;
      top: 50%;
      left: -20px;
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
      transform: translateY(-50%);
      transition: left 0.3s ease;
    }

    .back-link a:hover {
      background: rgba(167, 139, 250, 0.3);
      box-shadow: 0 12px 40px rgba(167, 139, 250, 0.35);
      transform: translateY(-4px);
      border-color: var(--text);
      color: var(--text);
      text-decoration: none;
      padding-left: 2rem;
    }

    .back-link a:hover::before {
      left: 10px;
    }
    

    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin: 2rem 0;
    }

    .photo-item {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .photo-item img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
      transition: transform 0.1s ease-out;
    }

    .photo-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(167, 139, 250, 0.25);
    }

    @media (max-width: 720px) {
      main {
        margin: 0;
      }

      .photo-gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>Secret Page</header>

    <div id="passwordSection" class="password-form">
      <p>Enter the password to access this page:</p>
      <label for="password">Password:</label>
      <input type="password" id="password" placeholder="Enter password">
      <button onclick="checkPassword()">Unlock</button>
      <div id="error" class="error"></div>
    </div>

    <div id="content" class="content">
      <h2>Nice job on unlocking this page!</h2>
      <p>Enjoy these stupid photos.</p>

      <h3 style="margin-top: 2rem; margin-bottom: 1rem;">Random Photos</h3>
      <div class="photo-gallery">
        <div class="photo-item">
          <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&h=300&fit=crop" alt="Random photo 1">
        </div>
        <div class="photo-item">
          <img src="https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=400&h=300&fit=crop" alt="Random photo 2">
        </div>
        <div class="photo-item">
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=300&fit=crop" alt="Random photo 3">
        </div>
        <div class="photo-item">
          <img src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=400&h=300&fit=crop" alt="Random photo 4">
        </div>
        <div class="photo-item">
          <img src="https://images.unsplash.com/photo-1501594907352-04cda38ebc29?w=400&h=300&fit=crop" alt="Random photo 5">
        </div>
      </div>

      <div class="back-link">
        <a href="index.html">Back to Portfolio</a>
      </div>
    </div>
  </main>

  <script>
    const CORRECT_PASSWORD = "2843";

    function checkPassword() {
      const passwordInput = document.getElementById("password");
      const errorDiv = document.getElementById("error");
      const password = passwordInput.value;

      if (password === CORRECT_PASSWORD) {
        document.getElementById("passwordSection").classList.add("hidden");
        document.getElementById("content").classList.add("visible");
        errorDiv.textContent = "";
        initCursorTracking();
      } else {
        errorDiv.textContent = "Incorrect password. Try again.";
        passwordInput.value = "";
        passwordInput.focus();
      }
    }

    document.getElementById("password").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });

    function initCursorTracking() {
      const photoItems = document.querySelectorAll(".photo-item img");
      
      document.addEventListener("mousemove", (e) => {
        const mouseX = e.clientX / window.innerWidth;
        const mouseY = e.clientY / window.innerHeight;

        photoItems.forEach((photo) => {
          const offsetX = (mouseX - 0.5) * 20;
          const offsetY = (mouseY - 0.5) * 20;
          
          photo.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(1.05)`;
        });
      });
    }
  </script>
</body>
</html>
